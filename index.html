<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0c"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Finanças</title><style>
:root{color-scheme:dark;--bg:#09090b;--card:#151518;--muted:#8e8e93;--line:#27272a;--green:#30d158;--red:#ff453a;--yellow:#ffd60a}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial;background:var(--bg);color:#fff}.wrap{max-width:620px;margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 30px)}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}h1{font-size:31px;margin:0;letter-spacing:-1px}.muted{color:var(--muted);font-size:13px}.balance{padding:24px;border-radius:25px;background:linear-gradient(145deg,#202024,#111113);margin-bottom:14px}.balance strong{display:block;font-size:38px;margin-top:7px;letter-spacing:-1.5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);padding:17px;border-radius:20px}.card b{font-size:21px;display:block;margin-top:8px}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}nav{display:flex;gap:7px;margin:20px 0 12px}.tab{border:0;background:#1c1c1f;color:#aaa;padding:9px 14px;border-radius:99px}.tab.on{background:#fff;color:#000}.section-title{font-size:18px;font-weight:700;margin:24px 2px 10px}.tx{display:flex;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}.dot{width:10px;height:10px;border-radius:50%;margin-right:12px}.tx-main{flex:1}.tx-main b{display:block}.tx-main small{color:var(--muted)}.amt{font-weight:700}.empty{text-align:center;color:var(--muted);padding:30px 10px}.sync{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}@media(display-mode:standalone){.wrap{padding-top:calc(env(safe-area-inset-top) + 12px)}}
</style></head><body><main class="wrap"><header><div><div class="muted">CONTROLE FINANCEIRO</div><h1>Visão geral</h1></div><div class="muted" id="today"></div></header><section class="balance"><span class="muted">Saldo</span><strong id="balance">R$ 0,00</strong><span class="muted" id="periodLabel">Este mês</span></section><section class="grid"><div class="card"><span class="green">● Entradas</span><b id="income">R$ 0,00</b></div><div class="card"><span class="red">● Gastos</span><b id="expense">R$ 0,00</b></div><div class="card"><span class="yellow">● Fixos</span><b id="fixed">R$ 0,00</b></div><div class="card"><span class="muted">Média semanal</span><b id="avg">R$ 0,00</b></div></section><nav><button class="tab" data-period="week">Semana</button><button class="tab on" data-period="month">Mês</button></nav><div class="section-title">Movimentações</div><section id="transactions"></section><div class="sync" id="sync">Modo demonstração • configure a URL do Google Apps Script em app.js</div></main><script src="app.js"></script></body></html>
