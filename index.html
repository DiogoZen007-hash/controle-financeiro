<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b0e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="My Finance"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>My Finance</title><style>
*{box-sizing:border-box} :root{color-scheme:dark;--bg:#070a0d;--card:#11161a;--muted:#8c9298;--red:#ff4f59;--green:#2ee58a;--yellow:#ffd83d;--line:#252c32}body{margin:0;background:radial-gradient(circle at 50% -10%,#17222c 0,#0b1116 27%,var(--bg) 55%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",Arial,sans-serif;min-height:100vh}.app{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 26px) 22px calc(env(safe-area-inset-bottom) + 32px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:16px}.logo{width:58px;height:58px;border-radius:18px;box-shadow:0 8px 28px #0009}.brand h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-1px}.brand p{margin:4px 0 0;color:var(--muted);font-size:15px}.calendar{width:54px;height:54px;border:1px solid #20262b;background:linear-gradient(145deg,#171c20,#0c1013);border-radius:18px;display:grid;place-items:center;font-size:24px}.periods{display:flex;background:#0e1317;border:1px solid #20262b;padding:5px;border-radius:15px;margin-bottom:18px}.periods button{flex:1;border:0;background:transparent;color:#858c92;padding:10px;border-radius:11px;font-weight:700}.periods button.on{background:#20272c;color:#fff}.card{position:relative;overflow:hidden;border:1px solid #343a3f;background:linear-gradient(120deg,#15191d,#101417);border-radius:26px;padding:24px;box-shadow:inset 0 1px 0 #ffffff0b,0 18px 55px #0007}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent);box-shadow:0 0 22px var(--accent)}.expense{--accent:var(--red);background:radial-gradient(circle at 10% 50%,#53151b99,transparent 48%),linear-gradient(120deg,#211418,#17191b);margin-bottom:16px}.smallgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.income{--accent:var(--green);background:radial-gradient(circle at 10% 55%,#074a2d99,transparent 55%),linear-gradient(120deg,#0b2c20,#151a18)}.fixed{--accent:var(--yellow);background:radial-gradient(circle at 10% 55%,#5c4a0799,transparent 55%),linear-gradient(120deg,#312b12,#1b1b17)}.label{font-size:22px;font-weight:800}.sub{color:#a4a7aa;margin-top:5px}.amount{font-size:38px;font-weight:850;letter-spacing:-1.5px;margin-top:22px;color:var(--accent)}.expense .amount{font-size:46px}.balance{margin:22px 2px 8px;color:#a6adb3}.balance strong{display:block;color:#fff;font-size:27px;margin-top:3px}.section{display:flex;align-items:end;justify-content:space-between;margin:30px 2px 10px}.section h2{margin:0;font-size:21px}.section span{font-size:13px;color:var(--muted)}.tx{display:flex;align-items:center;padding:16px 3px;border-bottom:1px solid var(--line)}.dot{width:11px;height:11px;border-radius:50%;margin-right:13px}.dot.red{background:var(--red);box-shadow:0 0 10px #ff4f5977}.dot.green{background:var(--green);box-shadow:0 0 10px #2ee58a77}.dot.yellow{background:var(--yellow);box-shadow:0 0 10px #ffd83d77}.txmain{flex:1}.txmain b{display:block;font-size:16px}.txmain small{color:var(--muted)}.tx strong{font-size:16px}.red{color:var(--red)}.green{color:var(--green)}.yellow{color:var(--yellow)}.empty{text-align:center;color:var(--muted);padding:32px 8px}.sync{text-align:center;color:#70777d;font-size:12px;margin-top:22px}@media(max-width:390px){.app{padding-left:16px;padding-right:16px}.brand h1{font-size:27px}.smallgrid{gap:10px}.card{padding:19px}.amount{font-size:29px}.expense .amount{font-size:39px}}
</style></head><body><main class="app"><header><div class="brand"><img class="logo" src="icon-512.png"><div><h1>My Finance</h1><p>Seu controle financeiro</p></div></div><div class="calendar">▣</div></header><div class="periods"><button class="period" data-period="week">Semana</button><button class="period on" data-period="month">Mês</button></div><section class="card expense"><div class="label">Gastos</div><div class="sub">Total do período</div><div class="amount" id="expense">− R$ 0,00</div></section><section class="smallgrid"><div class="card income"><div class="label">Entrada</div><div class="sub">Total do período</div><div class="amount" id="income">R$ 0,00</div></div><div class="card fixed"><div class="label">Fixo</div><div class="sub">Total do período</div><div class="amount" id="fixed">− R$ 0,00</div></div></section><div class="balance">Saldo do período<strong id="balance">R$ 0,00</strong></div><div class="section"><h2>Movimentações</h2><span id="periodLabel">Este mês</span></div><section id="transactions"></section><div class="sync" id="sync">Conectando ao Google Sheets…</div></main><script src="app.js"></script></body></html>
