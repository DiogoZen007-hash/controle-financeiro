<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#080b0e">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="My Finance">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>My Finance</title>

<style>

*{
  box-sizing:border-box
}

:root{
  color-scheme:dark;
  --bg:#070a0d;
  --card:#11161a;
  --muted:#8c9298;
  --red:#ff4f59;
  --green:#2ee58a;
  --yellow:#ffd83d;
  --line:#252c32
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 50% -10%,
      #17222c 0,
      #0b1116 27%,
      var(--bg) 55%
    );

  color:#fff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Inter",
    Arial,
    sans-serif;

  min-height:100vh;
}

body.modal-open{
  overflow:hidden;
}

.app{
  max-width:520px;
  margin:auto;

  padding:
    calc(env(safe-area-inset-top) + 26px)
    22px
    calc(env(safe-area-inset-bottom) + 100px);
}

/* HEADER */

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  width:58px;
  height:58px;
  border-radius:18px;
  box-shadow:0 8px 28px #0009;
}

.brand h1{
  font-size:30px;
  margin:0;
  font-weight:800;
  letter-spacing:-1px;
}

.brand p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:15px;
}

.calendar{
  width:54px;
  height:54px;

  border:1px solid #20262b;

  background:
    linear-gradient(
      145deg,
      #171c20,
      #0c1013
    );

  border-radius:18px;

  display:grid;
  place-items:center;

  font-size:24px;
}

/* PERÍODO */

.periods{
  display:flex;

  background:#0e1317;

  border:1px solid #20262b;

  padding:5px;

  border-radius:15px;

  margin-bottom:18px;
}

.periods button{
  flex:1;

  border:0;

  background:transparent;

  color:#858c92;

  padding:10px;

  border-radius:11px;

  font-weight:700;
}

.periods button.on{
  background:#20272c;
  color:#fff;
}

/* CARDS */

.card{
  position:relative;

  overflow:hidden;

  border:1px solid #343a3f;

  background:
    linear-gradient(
      120deg,
      #15191d,
      #101417
    );

  border-radius:26px;

  padding:24px;

  box-shadow:
    inset 0 1px 0 #ffffff0b,
    0 18px 55px #0007;
}

.card:before{
  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:7px;

  background:var(--accent);

  box-shadow:
    0 0 22px var(--accent);
}

.expense{
  --accent:var(--red);

  background:
    radial-gradient(
      circle at 10% 50%,
      #53151b99,
      transparent 48%
    ),
    linear-gradient(
      120deg,
      #211418,
      #17191b
    );

  margin-bottom:16px;
}

.smallgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.income{
  --accent:var(--green);

  background:
    radial-gradient(
      circle at 10% 55%,
      #074a2d99,
      transparent 55%
    ),
    linear-gradient(
      120deg,
      #0b2c20,
      #151a18
    );
}

.fixed{
  --accent:var(--yellow);

  background:
    radial-gradient(
      circle at 10% 55%,
      #5c4a0799,
      transparent 55%
    ),
    linear-gradient(
      120deg,
      #312b12,
      #1b1b17
    );
}

.label{
  font-size:22px;
  font-weight:800;
}

.sub{
  color:#a4a7aa;
  margin-top:5px;
}

.amount{
  font-size:38px;
  font-weight:850;
  letter-spacing:-1.5px;
  margin-top:22px;
  color:var(--accent);
}

.expense .amount{
  font-size:46px;
}

/* SALDO */

.balance{
  margin:22px 2px 8px;
  color:#a6adb3;
}

.balance strong{
  display:block;
  color:#fff;
  font-size:27px;
  margin-top:3px;
}

/* MOVIMENTAÇÕES */

.section{
  display:flex;
  align-items:end;
  justify-content:space-between;

  margin:30px 2px 10px;
}

.section h2{
  margin:0;
  font-size:21px;
}

.section span{
  font-size:13px;
  color:var(--muted);
}

.tx{
  display:flex;
  align-items:center;

  padding:16px 3px;

  border-bottom:
    1px solid var(--line);
}

.dot{
  width:11px;
  height:11px;
  border-radius:50%;
  margin-right:13px;
}

.dot.red{
  background:var(--red);
  box-shadow:0 0 10px #ff4f5977;
}

.dot.green{
  background:var(--green);
  box-shadow:0 0 10px #2ee58a77;
}

.dot.yellow{
  background:var(--yellow);
  box-shadow:0 0 10px #ffd83d77;
}

.txmain{
  flex:1;
}

.txmain b{
  display:block;
  font-size:16px;
}

.txmain small{
  color:var(--muted);
}

.tx strong{
  font-size:16px;
}

.red{
  color:var(--red);
}

.green{
  color:var(--green);
}

.yellow{
  color:var(--yellow);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:32px 8px;
}

.sync{
  text-align:center;
  color:#70777d;
  font-size:12px;
  margin-top:22px;
}

/* BOTÃO + */

.add-button{
  position:fixed;

  right:
    max(
      22px,
      calc((100vw - 520px) / 2 + 22px)
    );

  bottom:
    calc(
      env(safe-area-inset-bottom) + 22px
    );

  width:64px;
  height:64px;

  border:1px solid #394149;

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #242c32,
      #101519
    );

  color:#fff;

  font-size:38px;
  font-weight:300;

  display:grid;
  place-items:center;

  padding:0;

  box-shadow:
    0 12px 35px #000b,
    inset 0 1px 0 #ffffff22;

  z-index:20;

  cursor:pointer;

  transition:
    transform .15s ease,
    background .15s ease;
}

.add-button:active{
  transform:scale(.92);
}

/* FUNDO DO MODAL */

.modal-backdrop{
  position:fixed;

  inset:0;

  background:#000b;

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  display:flex;

  align-items:flex-end;
  justify-content:center;

  opacity:0;
  pointer-events:none;

  transition:opacity .2s ease;

  z-index:50;
}

.modal-backdrop.open{
  opacity:1;
  pointer-events:auto;
}

/* MODAL */

.modal{
  width:min(520px,100%);

  max-height:92vh;

  overflow:auto;

  background:
    radial-gradient(
      circle at 50% 0,
      #1a252d,
      transparent 35%
    ),
    #0c1115;

  border:
    1px solid #2c343a;

  border-bottom:0;

  border-radius:
    30px 30px 0 0;

  padding:
    12px
    22px
    calc(env(safe-area-inset-bottom) + 26px);

  transform:translateY(30px);

  transition:transform .25s ease;

  box-shadow:
    0 -20px 60px #000c;
}

.modal-backdrop.open .modal{
  transform:translateY(0);
}

.modal-handle{
  width:42px;
  height:5px;

  border-radius:20px;

  background:#40474c;

  margin:2px auto 22px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:22px;
}

.modal-header h2{
  margin:0;

  font-size:26px;

  letter-spacing:-.7px;
}

.close-modal{
  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:#1c2227;

  color:#aeb4b8;

  font-size:22px;

  display:grid;
  place-items:center;
}

/* TIPO */

.type-selector{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  padding:5px;

  background:#090d10;

  border:
    1px solid #242b30;

  border-radius:16px;

  margin-bottom:22px;
}

.type-option{
  border:0;

  border-radius:12px;

  background:transparent;

  color:#7f878d;

  padding:12px 5px;

  font-weight:750;

  font-size:14px;
}

.type-option.active[data-type="Gasto"]{
  background:#3b171b;
  color:var(--red);
}

.type-option.active[data-type="Entrada"]{
  background:#0d3424;
  color:var(--green);
}

.type-option.active[data-type="Fixo"]{
  background:#393114;
  color:var(--yellow);
}

/* FORMULÁRIO */

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;

  color:#a7adb2;

  font-size:13px;

  font-weight:700;

  margin:
    0 0 8px 3px;
}

.form-input{
  width:100%;

  border:
    1px solid #2b3339;

  outline:0;

  background:#11171b;

  color:#fff;

  border-radius:16px;

  padding:15px 16px;

  font-size:17px;

  font-family:inherit;
}

.form-input:focus{
  border-color:#59646c;

  box-shadow:
    0 0 0 3px #ffffff08;
}

.value-input{
  font-size:27px;
  font-weight:800;
  letter-spacing:-.5px;
}

/* CATEGORIAS */

.categories{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;
}

.category{
  border:
    1px solid #272e33;

  background:#101519;

  color:#8d959b;

  border-radius:14px;

  padding:11px 4px;

  font-size:12px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:5px;
}

.category span{
  font-size:21px;
}

.category.active{
  border-color:#606a72;

  background:#1b2227;

  color:#fff;
}

/* SALVAR */

.save-transaction{
  width:100%;

  margin-top:8px;

  border:0;

  border-radius:17px;

  padding:17px;

  font-size:16px;

  font-weight:800;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #343e46,
      #20272c
    );

  box-shadow:
    inset 0 1px 0 #ffffff18;

  cursor:pointer;
}

.save-transaction:active{
  transform:scale(.98);
}

.save-transaction:disabled{
  opacity:.55;
}

/* MOBILE */

@media(max-width:390px){

  .app{
    padding-left:16px;
    padding-right:16px;
  }

  .brand h1{
    font-size:27px;
  }

  .smallgrid{
    gap:10px;
  }

  .card{
    padding:19px;
  }

  .amount{
    font-size:29px;
  }

  .expense .amount{
    font-size:39px;
  }

  .add-button{
    right:16px;
  }

}

</style>
</head>

<body>

<main class="app">

<header>

<div class="brand">

<img
  class="logo"
  src="icon-512.png"
  alt="My Finance"
>

<div>

<h1>My Finance</h1>

<p>Seu controle financeiro</p>

</div>

</div>

<div class="calendar">▣</div>

</header>


<div class="periods">

<button
  class="period"
  data-period="week"
>
Semana
</button>

<button
  class="period on"
  data-period="month"
>
Mês
</button>

</div>


<section class="card expense">

<div class="label">
Gastos
</div>

<div class="sub">
Total do período
</div>

<div
  class="amount"
  id="expense"
>
− R$ 0,00
</div>

</section>


<section class="smallgrid">

<div class="card income">

<div class="label">
Entrada
</div>

<div class="sub">
Total do período
</div>

<div
  class="amount"
  id="income"
>
R$ 0,00
</div>

</div>


<div class="card fixed">

<div class="label">
Fixo
</div>

<div class="sub">
Total do período
</div>

<div
  class="amount"
  id="fixed"
>
− R$ 0,00
</div>

</div>

</section>


<div class="balance">

Saldo do período

<strong id="balance">
R$ 0,00
</strong>

</div>


<div class="section">

<h2>
Movimentações
</h2>

<span id="periodLabel">
Este mês
</span>

</div>


<section id="transactions">
</section>


<div
  class="sync"
  id="sync"
>
Conectando ao Google Sheets…
</div>

</main>


<!-- BOTÃO FLUTUANTE -->

<button
  class="add-button"
  id="openTransactionModal"
  aria-label="Adicionar movimentação"
>
+
</button>


<!-- MODAL -->

<div
  class="modal-backdrop"
  id="transactionModal"
>

<div class="modal">

<div class="modal-handle">
</div>


<div class="modal-header">

<h2 id="transactionModalTitle">
Nova movimentação
</h2>

<button
  class="close-modal"
  id="closeTransactionModal"
>
×
</button>

</div>


<div class="type-selector">

<button
  class="type-option active"
  data-type="Gasto"
>
🔴 Gasto
</button>

<button
  class="type-option"
  data-type="Entrada"
>
🟢 Entrada
</button>

<button
  class="type-option"
  data-type="Fixo"
>
🟡 Fixo
</button>

</div>


<div class="form-group">

<label for="manualValue">
Valor
</label>

<input
  class="form-input value-input"
  id="manualValue"
  type="text"
  inputmode="decimal"
  placeholder="R$ 0,00"
  autocomplete="off"
>

</div>


<div class="form-group">

<label for="manualDescription">
Descrição
</label>

<input
  class="form-input"
  id="manualDescription"
  type="text"
  placeholder="Ex.: Mercado"
  autocomplete="off"
>

</div>


<div class="form-group">

<label>
Categoria
</label>

<div
  class="categories"
  id="manualCategories"
>

<button
  class="category active"
  data-category="Alimentação"
>
<span>🍔</span>
Alimentação
</button>

<button
  class="category"
  data-category="Transporte"
>
<span>🚗</span>
Transporte
</button>

<button
  class="category"
  data-category="Compras"
>
<span>🛍️</span>
Compras
</button>

<button
  class="category"
  data-category="Lazer"
>
<span>🎮</span>
Lazer
</button>

<button
  class="category"
  data-category="Saúde"
>
<span>🩺</span>
Saúde
</button>

<button
  class="category"
  data-category="Faculdade"
>
<span>🎓</span>
Faculdade
</button>

<button
  class="category"
  data-category="Assinaturas"
>
<span>📱</span>
Assinaturas
</button>

<button
  class="category"
  data-category="Outros"
>
<span>📦</span>
Outros
</button>

</div>

</div>


<button
  class="save-transaction"
  id="saveManualTransaction"
>
Adicionar movimentação
</button>

<button
  class="delete-transaction"
  id="deleteTransaction"
  style="
    display:none;
    width:100%;
    margin-top:10px;
    border:1px solid #5b2228;
    border-radius:17px;
    padding:16px;
    font-size:16px;
    font-weight:800;
    color:#ff5964;
    background:#261216;
  "
>
Excluir movimentação
</button>

</div>

</div>


<script src="app.js"></script>

</body>
</html>
